<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Journal de trades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>window.FBReady = new Promise(function (r) { window.__fbResolve = r; });</script>
<script src="firebase-config.js"></script>
<script type="module" src="firebase-adapter.js"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Journal de trades</h1>
      <p id="hello">Tes positions, tes captures, tes notes.</p>
    </div>
    <div class="top-actions">
      <div class="seg" role="group" aria-label="Devise des gains et pertes" id="cur">
        <button type="button" data-cur="EUR" aria-label="Euro">€</button>
        <button type="button" data-cur="USD" aria-label="Dollar">$</button>
      </div>
      <details class="acct" id="acct" hidden>
        <summary class="btn" id="acctName">Compte</summary>
        <div class="acct-menu">
          <p id="acctMail"></p>
          <label class="btn small">Importer des trades (.json)<input type="file" accept="application/json,.json" id="importFile" class="sr-only"></label>
          <button type="button" class="btn small danger" id="logout">Se déconnecter</button>
        </div>
      </details>
      <button type="button" class="btn primary" id="newTrade"></button>
    </div>
  </header>

  <div id="banner" role="status"></div>

  <nav class="menu" id="menu" aria-label="Sections du journal">
    <button type="button" data-view="apercu" aria-current="page">Vue d’ensemble</button>
    <button type="button" data-view="calendrier" aria-current="false">Calendrier</button>
    <button type="button" data-view="trades" aria-current="false">Mes trades</button>
    <button type="button" data-view="backtest" aria-current="false">Backtest</button>
    <button type="button" data-view="analyse" aria-current="false">Analyse</button>
  </nav>

  <div class="scope" id="scopeBar">
    <div class="seg" role="group" aria-label="Type de trades" id="scope">
      <button type="button" data-scope="all" aria-pressed="true">Tout</button>
      <button type="button" data-scope="backtest" aria-pressed="false">Backtest</button>
      <button type="button" data-scope="live" aria-pressed="false">Réel</button>
    </div>
    <div id="stratFilter"></div>
  </div>

  <main class="views">
  <section class="dash" id="dash" data-view="apercu" aria-label="Résumé de tes résultats"></section>

  <section class="cal-sec" data-view="calendrier" aria-labelledby="c-title" hidden>
    <div class="toolbar">
      <h2 id="c-title">Calendrier des gains</h2>
      <div class="cal-nav">
        <button type="button" class="btn small" id="calToday">Ce mois-ci</button>
        <button type="button" class="icon-btn sm" id="calPrev" aria-label="Mois précédent"></button>
        <span class="cal-label" id="calLabel" aria-live="polite"></span>
        <button type="button" class="icon-btn sm" id="calNext" aria-label="Mois suivant"></button>
      </div>
    </div>
    <div class="cal" id="cal"></div>
  </section>

  <section class="journal" data-view="trades" aria-labelledby="j-title" hidden>
    <div class="toolbar">
      <h2 id="j-title">Mes trades</h2>
      <div class="chips" id="filters" role="group" aria-label="Filtrer les trades">
        <button type="button" class="chip" data-f="all" aria-pressed="true">Tous<span class="n"></span></button>
        <button type="button" class="chip" data-f="win" aria-pressed="false">Gagnants<span class="n"></span></button>
        <button type="button" class="chip" data-f="loss" aria-pressed="false">Perdants<span class="n"></span></button>
        <button type="button" class="chip" data-f="open" aria-pressed="false">En cours<span class="n"></span></button>
      </div>
      <input class="inp search" id="q" type="search" placeholder="Rechercher un instrument" aria-label="Rechercher un instrument" autocomplete="off">
    </div>
    <div id="dayfilter"></div>
    <div class="list" id="list"></div>
  </section>

  <section data-view="backtest" aria-labelledby="b-title" hidden>
    <div class="toolbar">
      <h2 id="b-title">Mes backtests</h2>
      <button type="button" class="btn primary" id="newBacktest"></button>
    </div>
    <div id="backtest"></div>
  </section>

  <section data-view="analyse" aria-labelledby="a-title" hidden>
    <div class="toolbar"><h2 id="a-title">Analyse</h2></div>
    <div id="analyse"></div>
  </section>
  </main>
  <div id="sharedView"></div>
</div>


<div class="auth" id="auth" hidden>
  <div class="auth-card">
    <h1>Journal de trades</h1>
    <p>Connecte-toi pour retrouver tes trades, tes captures et ton calendrier sur tous tes appareils.</p>
    <button type="button" class="btn g-btn" id="gBtn">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continuer avec Google
    </button>
    <p class="auth-or">ou avec ton e-mail</p>
    <label class="f"><span>Adresse e-mail</span><input class="inp" type="email" id="aMail" autocomplete="email" inputmode="email"></label>
    <label class="f"><span>Mot de passe</span><input class="inp" type="password" id="aPass" autocomplete="current-password"></label>
    <p class="auth-err" id="aErr" role="alert"></p>
    <div class="auth-actions">
      <button type="button" class="btn primary" id="aIn">Se connecter</button>
      <button type="button" class="btn" id="aUp">Créer un compte</button>
    </div>
    <button type="button" class="linklike" id="aReset">Mot de passe oublié ?</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
